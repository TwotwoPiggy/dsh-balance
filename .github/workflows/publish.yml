name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: Install Dependencies
        run: npm install

      - name: Run Full Test Suite (Full + Lite)
        run: npm run test:all

      - name: Publish dsh-balance (Full)
        run: npm publish --provenance --access public

      - name: Publish dsh-balance-lite (Lite)
        run: node scripts/publish-lite.mjs --provenance
